[build]
  command = "npm run build"
  # The Next.js runtime plugin reads .next and turns it into Netlify
  # Functions + edge functions; don't point this at `out`.
  publish = ".next"

[build.environment]
  # Node 20 runs on Amazon Linux 2023 (OpenSSL 3), which is why
  # prisma/schema.prisma lists rhel-openssl-3.0.x among its binaryTargets.
  #
  # Engine targets belong in schema.prisma, NOT here: the legacy
  # PRISMA_CLI_BINARY_TARGETS override rejects "native" outright and fails the
  # install with "Unknown binaryTarget native".
  NODE_VERSION = "20"

  # Netlify's secrets scanner flags any env value it finds in build output.
  # These are public by construction, so finding them is expected, not a leak:
  #   NEXT_PUBLIC_* — Next inlines these into the browser bundle by design
  #   AUTH_URL / NEXTAUTH_URL / NEXT_PUBLIC_SITE_URL — the site's own address,
  #     which necessarily appears in canonical tags, OG tags and the sitemap
  #   CLOUDINARY_CLOUD_NAME — sits in the middle of every delivery URL
  #     (res.cloudinary.com/<cloud_name>/image/upload/...), so it lands in the
  #     prerendered HTML of any page showing an uploaded image. It identifies
  #     the account; it does not authorise anything.
  #
  # Scanning stays ON for everything else. AUTH_SECRET, DATABASE_URL,
  # CLOUDINARY_API_KEY/SECRET and ADMIN_PASSWORD are still checked, which is
  # the reason not to reach for SECRETS_SCAN_ENABLED=false here. In particular
  # the API key and secret are what actually gate uploads and deletions.
  SECRETS_SCAN_OMIT_KEYS = "AUTH_URL,NEXTAUTH_URL,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SITE_NAME,CLOUDINARY_CLOUD_NAME,NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME,NEXT_PUBLIC_GOOGLE_ENABLED"

[[plugins]]
  # Provides SSR, ISR, image optimisation and Next middleware on Netlify.
  package = "@netlify/plugin-nextjs"

# Deploy previews and branch builds should never be indexed — only the
# production domain should appear in search results.
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex"
